<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在地食百二：那弈那學—用桌遊玩中學在地蔬菜與水果 教學策略分享</title>
  <style>
    :root {
      --primary-color: #2e7d32;
      --secondary-color: #1b5e20;
      --accent-color: #ef6c00;
      --bg-color: #f7faf5;
      --card-bg: #ffffff;
      --text-color: #2c2c2c;
      --border-color: #d5e2d0;
      --sidebar-width: 270px;
      --font-scale: 1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.65;
      font-size: calc(16px * var(--font-scale));
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      background-color: #1f3322;
      color: #eef5ee;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 22px 20px;
      background: var(--primary-color);
      border-bottom: 3px solid var(--accent-color);
    }
    .sidebar-header h2 { font-size: 1.25rem; color: #fff; margin-bottom: 4px; }
    .sidebar-header p { font-size: 0.85rem; color: #dcedc8; }

    .nav-links { list-style: none; padding: 12px 0; }
    .nav-links li a {
      display: block;
      padding: 13px 20px;
      color: #c8d8c8;
      text-decoration: none;
      font-size: 0.95rem;
      border-left: 4px solid transparent;
      transition: all 0.2s;
    }
    .nav-links li a:hover, .nav-links li a.active {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
      border-left-color: var(--accent-color);
      font-weight: bold;
    }

    .main-wrapper {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 90;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .controls button {
      background: #e8f5e9;
      border: 1px solid #b9d8bc;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      color: #2e7d32;
      margin-left: 5px;
    }
    .controls button:hover { background: #c8e6c9; color: #1b5e20; }

    .mobile-toggle { display: none; background: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }

    .content { padding: 40px 50px; max-width: 1050px; margin: 0 auto; width: 100%; }

    .banner-card {
      background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
      color: white;
      padding: 35px;
      border-radius: 12px;
      margin-bottom: 35px;
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.2);
    }
    .banner-card h1 { font-size: 1.9rem; margin-bottom: 8px; color: #fff; }
    .banner-card .pinyin-sub { font-size: 1.15rem; color: #ffe082; font-weight: bold; letter-spacing: 0.5px; margin-bottom: 10px; }
    .banner-card p { font-size: 1rem; color: #e8f5e9; }

    section {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 30px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    h2.section-title {
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }
    h3.sub-title {
      color: var(--secondary-color);
      margin: 22px 0 10px 0;
      font-size: 1.15rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .info-box {
      background: #f4f9f4;
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 6px;
    }
    .info-box strong { color: var(--primary-color); display: block; margin-bottom: 5px; }

    .game-card {
      background: #fafcf9;
      border-left: 4px solid var(--accent-color);
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 0 6px 6px 0;
      border-top: 1px solid #e4ece2;
      border-right: 1px solid #e4ece2;
      border-bottom: 1px solid #e4ece2;
    }
    .game-card h4 { color: var(--primary-color); font-size: 1.15rem; margin-bottom: 10px; }

    .step-badge {
      display: inline-block;
      background: #fff3e0;
      color: #e65100;
      border: 1px solid #ffcc80;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-right: 6px;
    }

    .special-card-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .special-item {
      background: #fff8e1;
      border: 1px solid #ffe082;
      padding: 15px;
      border-radius: 8px;
    }
    .special-item.fridge {
      background: #e3f2fd;
      border-color: #90caf9;
    }

    /* 字卡圖鑑網格 */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 220px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
    }
    .filter-btn {
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      color: #444;
    }
    .filter-btn.active {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 14px;
    }
    .vocab-card {
      border-radius: 10px;
      padding: 16px 12px;
      text-align: center;
      border: 2px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: transform 0.15s;
    }
    .vocab-card:hover { transform: translateY(-3px); }
    .vocab-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.85);
      color: #333;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .vocab-hanzi {
      font-size: 1.4rem;
      font-weight: bold;
      color: #111;
      background: #fdfbf2;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 4px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
    }
    .vocab-pinyin {
      font-size: 1.05rem;
      font-weight: bold;
      color: #222;
      background: rgba(255,255,255,0.9);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    /* 牌卡底色分類對應 */
    .bg-brown { background-color: #a68250; }
    .bg-green { background-color: #558b2f; }
    .bg-coral { background-color: #e57373; }
    .bg-purple { background-color: #9575cd; }
    .bg-teal { background-color: #00838f; }
    .bg-gray { background-color: #757575; }
    .bg-special { background-color: #fbc02d; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      font-size: 0.95rem;
    }
    th, td {
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      text-align: left;
    }
    th { background: #e8f5e9; color: var(--secondary-color); font-weight: bold; }
    tr:nth-child(even) { background-color: #f9fbf9; }

    /* 數位計分板 */
    .score-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 15px;
    }
    .player-card {
      background: #f9fbf9;
      border: 2px solid var(--border-color);
      padding: 14px;
      border-radius: 8px;
      text-align: center;
    }
    .player-score { font-size: 2rem; font-weight: bold; color: var(--primary-color); margin: 8px 0; }
    .score-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin: 2px;
    }
    .score-btn.sub { background: #666; }

    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrapper { margin-left: 0; }
      .mobile-toggle { display: block; }
      .content { padding: 20px; }
      .score-board { grid-template-columns: repeat(2, 1fr); }
    }

    @media print {
      .sidebar, .top-bar, .controls, .interactive-tool, .filter-bar { display: none !important; }
      .main-wrapper { margin-left: 0; }
      body { background: white; color: black; font-size: 12pt; }
      section { border: none; box-shadow: none; padding: 0; margin-bottom: 20px; page-break-inside: avoid; }
    }
  </style>
</head>
